# -*- mode: yaml; tab-width: 2; indent-tabs-mode: nil; -*-
---
name: VM Test

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

env:
  COVERAGE_GO_VERSION: "1.26.2"

jobs:
  vm-coverage:
    name: ${{ matrix.target.os }} ${{ matrix.target.release }} / Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.0", "1.26.2"]
        target:
          - os: freebsd
            release: "14.4"
          - os: freebsd
            release: "15.0"
          - os: ubuntu
            release: "24.04"
          - os: ubuntu
            release: "26.04"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Cache anyvm data
        uses: actions/cache@v4
        with:
          path: .cache/anyvm-data
          key: anyvm-${{ matrix.target.os }}-${{ matrix.target.release }}-${{ runner.os }}-${{ runner.arch }}-v2
          restore-keys: |
            anyvm-${{ matrix.target.os }}-${{ matrix.target.release }}-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Run VM tests
        run: >
          scripts/test-vm.sh
          --os "${{ matrix.target.os }}"
          --release "${{ matrix.target.release }}"
          --go-version "${{ matrix.go-version }}"
          --coverage-dir ".cache/coverage/raw/vm-${{ matrix.target.os }}-${{ matrix.target.release }}-go-${{ matrix.go-version }}"

      - name: Upload raw coverage
        uses: actions/upload-artifact@v4
        with:
          name: raw-coverage-vm-${{ matrix.target.os }}-${{ matrix.target.release }}-go-${{ matrix.go-version }}
          path: .cache/coverage/raw/vm-${{ matrix.target.os }}-${{ matrix.target.release }}-go-${{ matrix.go-version }}
          if-no-files-found: error

  coverage-report:
    name: Coverage report
    runs-on: ubuntu-latest
    needs:
      - vm-coverage

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.COVERAGE_GO_VERSION }}

      - name: Set up just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.55.1"

      - name: Download raw coverage
        uses: actions/download-artifact@v4
        with:
          pattern: raw-coverage-vm-*-go-${{ env.COVERAGE_GO_VERSION }}
          path: .cache/coverage/downloaded
          merge-multiple: true

      - name: Generate coverage report
        run: just coverage-report --covdata-input .cache/coverage/downloaded

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .cache/coverage/report/coverage.out
            .cache/coverage/report/coverage.txt
            .cache/coverage/report/coverage.html
          if-no-files-found: error
